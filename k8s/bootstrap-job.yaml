apiVersion: v1
kind: Pod
metadata:
  name: kg-coop-bootstrap
  namespace: seelab
  labels:
    app: kg-coop-bootstrap
spec:
  restartPolicy: OnFailure

  containers:
    - name: bootstrap
      image: ubuntu:22.04
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash", "-lc"]
      args:
        - |
          #!/usr/bin/env bash
          set -euxo pipefail

          echo "[INFO] Installing system deps..."
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git git-lfs openssh-client bzip2 unzip \
            vim tmux less nano python3 python3-pip

          git lfs install

          echo "[INFO] Installing micromamba..."
          mkdir -p /tmp/micromamba
          curl -Ls https://micro.mamba.pm/api/micromamba/linux-64/latest \
            | tar -xvj -C /tmp/micromamba --strip-components=1 bin/micromamba

          export PATH=/tmp/micromamba:$PATH
          export MAMBA_ROOT_PREFIX=/tmp/micromamba-root

          echo "[INFO] Creating clean env..."
          rm -rf /tmp/ct_env
          micromamba create -y -p /tmp/ct_env -c conda-forge python=3.8 pip

          echo "[INFO] Installing repo requirements..."
          cd /workspace/concept_transformer
          micromamba run -p /tmp/ct_env python -m pip install --upgrade pip
          micromamba run -p /tmp/ct_env pip install -r requirements.txt

          echo "[INFO] Fixing setuptools/distutils compatibility..."
          micromamba run -p /tmp/ct_env pip uninstall -y setuptools || true
          micromamba run -p /tmp/ct_env pip install "setuptools==59.5.0"

          echo "[INFO] Downloading MNIST manually..."
          for DIR in /workspace/data/MNIST/raw /root/data/MNIST/raw /workspace/concept_transformer/data/MNIST/raw; do
            mkdir -p "$DIR"
            cd "$DIR"

            curl -L -O https://ossci-datasets.s3.amazonaws.com/mnist/train-images-idx3-ubyte.gz
            curl -L -O https://ossci-datasets.s3.amazonaws.com/mnist/train-labels-idx1-ubyte.gz
            curl -L -O https://ossci-datasets.s3.amazonaws.com/mnist/t10k-images-idx3-ubyte.gz
            curl -L -O https://ossci-datasets.s3.amazonaws.com/mnist/t10k-labels-idx1-ubyte.gz
          done

          cd /workspace/concept_transformer

          echo "[INFO] Preventing broken torchvision MNIST download..."
          sed -i 's/download=True/download=False/g' /workspace/concept_transformer/data/mnist_dataset.py
          sed -i 's/download=False/download=False/g' /workspace/concept_transformer/data/mnist_dataset.py

          echo "[INFO] Checking CUDA..."
          micromamba run -p /tmp/ct_env python - <<'PY'
          import torch
          print("torch:", torch.__version__)
          print("cuda available:", torch.cuda.is_available())
          if torch.cuda.is_available():
              print("gpu:", torch.cuda.get_device_name(0))
          PY

          echo "[INFO] Setup done."
          echo "Run training with:"
          echo "export PATH=/tmp/micromamba:\$PATH"
          echo "export MAMBA_ROOT_PREFIX=/tmp/micromamba-root"
          echo "cd /workspace/concept_transformer"
          echo "micromamba run -p /tmp/ct_env python ctc_mnist.py"

          nvidia-smi || true
          sleep infinity
      env:
        - name: DOWNLOAD_DATASET_JSONS
          value: "true"
        - name: DOWNLOAD_PROCESSED_FEATURES
          value: "true"
        - name: DOWNLOAD_MODEL_CKPT
          value: "true"
      resources:
        requests:
          cpu: "4"
          memory: "16Gi"
        limits:
          cpu: "4"
          memory: "16Gi"
      volumeMounts:
        - name: storage
          mountPath: /workspace
        - name: ssh-secret
          mountPath: /ssh-secret
          readOnly: true

  volumes:
    - name: storage
      persistentVolumeClaim:
        claimName: 
    - name: ssh-secret
      secret:
        secretName: 
        defaultMode: 
