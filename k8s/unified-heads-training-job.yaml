apiVersion: batch/v1
kind: Job
metadata:
  name: unified-heads-train-v1
  namespace: seelab
  labels:
    app: unified-heads-train-v1
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: unified-heads-train-v1
    spec:
      restartPolicy: Never
      tolerations:
        - key: nautilus.io/reservation
          operator: Exists
          effect: NoSchedule
        - key: nautilus.io/issue
          operator: Exists
          effect: NoSchedule
      containers:
        - name: runner
          image: quay.io/jupyter/scipy-notebook:latest
          imagePullPolicy: IfNotPresent
          terminationMessagePolicy: FallbackToLogsOnError
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              trap 'status=$?; echo "[ERROR] Job failed with exit code ${status}; sleeping for debug"; sleep 600; exit ${status}' ERR

              export DEBIAN_FRONTEND=noninteractive
              export WORKSPACE=/workspace
              export REPOS_DIR="${WORKSPACE}/repos"
              export KG_REPO_DIR="${REPOS_DIR}/kg_coop_drive"
              export V2VGOT_ROOT="${V2VGOT_ROOT:-${REPOS_DIR}/V2V-GoT}"
              export PYTHONPATH="${KG_REPO_DIR}/src:${KG_REPO_DIR}:${PYTHONPATH:-}"

              export UH_RUN_NAME="${UH_RUN_NAME:-unified_heads_v1}"
              export UH_LABELED_DIR="${UH_LABELED_DIR:-${KG_REPO_DIR}/outputs/unified_heads/v1/labeled/train}"
              export UH_OUTPUT_DIR="${UH_OUTPUT_DIR:-${KG_REPO_DIR}/outputs/unified_heads/v1/artifacts}"
              export UH_NUM_WORKERS="${UH_NUM_WORKERS:-8}"
              export UH_LOG_EVERY="${UH_LOG_EVERY:-100000}"
              export UH_MAX_ROWS="${UH_MAX_ROWS:-0}"
              export UH_DEBUG_SLEEP_ON_FAIL="${UH_DEBUG_SLEEP_ON_FAIL:-600}"

              mkdir -p "${WORKSPACE}/unified_heads_job_logs"
              LOG_FILE="${WORKSPACE}/unified_heads_job_logs/${UH_RUN_NAME}_train.log"
              touch "${LOG_FILE}" || true
              echo "[INFO] Persistent job log file: ${LOG_FILE}"

              check_path() {
                local label="$1"
                local path="$2"
                if [ -e "${path}" ]; then
                  echo "[PASS] ${label}: ${path}"
                else
                  echo "[FAIL] ${label}: ${path}"
                  exit 1
                fi
              }

              check_path "kg_coop_drive repo" "${KG_REPO_DIR}"
              check_path "V2V-GoT repo" "${V2VGOT_ROOT}"
              check_path "Stage3 trainer" "${KG_REPO_DIR}/scripts/train_unified_heads_models.py"
              check_path "Unified config" "${KG_REPO_DIR}/configs/unified_heads/default.yaml"
              check_path "Labeled object rows" "${UH_LABELED_DIR}/object_retrieval_labeled.jsonl"
              check_path "Labeled motion rows" "${UH_LABELED_DIR}/motion_regression_labeled.jsonl"
              check_path "Labeled scene rows" "${UH_LABELED_DIR}/scene_action_labeled.jsonl"

              missing_packages="$(python3 -c 'import importlib.util; specs={"yaml":"pyyaml","numpy":"numpy","sklearn":"scikit-learn"}; print(" ".join(pip for mod, pip in specs.items() if importlib.util.find_spec(mod) is None))')"
              if [ -n "${missing_packages}" ]; then
                echo "[FAIL] Missing Python packages: ${missing_packages}"
                exit 1
              fi
              echo "[PASS] Python package check: yaml, numpy, sklearn"

              cd "${KG_REPO_DIR}"

              command=(
                python3 scripts/train_unified_heads_models.py
                --config configs/unified_heads/default.yaml
                --labeled-dir "${UH_LABELED_DIR}"
                --output-dir "${UH_OUTPUT_DIR}"
                --num-workers "${UH_NUM_WORKERS}"
                --log-every "${UH_LOG_EVERY}"
                --overwrite
              )

              if [ "${UH_MAX_ROWS}" != "0" ]; then
                command+=(--max-rows "${UH_MAX_ROWS}")
              fi

              echo
              echo "============================================================"
              echo "Running Unified Heads Stage 3 Training"
              echo "============================================================"
              printf ' %q' "${command[@]}"
              echo
              "${command[@]}" 2>&1 | tee -a "${LOG_FILE}"

              echo
              echo "============================================================"
              echo "Unified Heads Training Complete"
              echo "============================================================"
              echo "[INFO] Artifacts root: ${UH_OUTPUT_DIR}"
              echo "[INFO] Summary: ${UH_OUTPUT_DIR}/train_unified_heads_summary.json"
          env:
            - name: UH_NUM_WORKERS
              value: "8"
            - name: UH_LOG_EVERY
              value: "100000"
            - name: UH_MAX_ROWS
              value: "0"
          resources:
            requests:
              cpu: "8"
              memory: "32Gi"
            limits:
              cpu: "8"
              memory: "32Gi"
          volumeMounts:
            - name: storage
              mountPath: /workspace
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: 
