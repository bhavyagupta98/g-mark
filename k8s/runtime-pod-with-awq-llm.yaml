apiVersion: v1
kind: Pod
metadata:
  name: kg-coop-runtime-awq-llm
  namespace: seelab
  labels:
    app: kg-coop-runtime-awq-llm
spec:
  restartPolicy: OnFailure
  tolerations:
    - key: nautilus.io/reservation
      operator: Exists
      effect: NoSchedule
    - effect: PreferNoSchedule
      key: nvidia.com/gpu
      operator: Exists
    - key: nautilus.io/issue
      operator: Exists
      effect: NoSchedule
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                  - NVIDIA-A10
                  - NVIDIA-RTX-A6000
                  - NVIDIA-A100-SXM4-80GB

  containers:
    - name: runtime-awq-llm
      image: vllm/vllm-openai:latest
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash", "-lc"]
      args:
        - |
          set -euo pipefail

          export DEBIAN_FRONTEND=noninteractive
          export WORKSPACE=/workspace
          export REPOS_DIR="${WORKSPACE}/repos"
          export KG_REPO_DIR="${REPOS_DIR}/kg_coop_drive"
          export V2VGOT_ROOT="${REPOS_DIR}/V2V-GoT"
          export KG_LOCAL_LLM_BASE_URL="http://127.0.0.1:8000"
          export KG_LOCAL_LLM_MODEL="Qwen/Qwen2.5-3B-Instruct-AWQ"
          export KG_LOCAL_LLM_API_KEY="local-token"
          export HF_HOME="/workspace/hf-cache"
          export PYTORCH_CUDA_ALLOC_CONF="expandable_segments:True"

          echo "[INFO] Installing runtime dependencies..."
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            python3 \
            python3-numpy \
            python3-pip \
            python3-pytest \
            python3-venv \
            git \
            less \
            vim \
            tmux
          rm -rf /var/lib/apt/lists/*

          echo "[INFO] Python version: $(python3 --version)"
          echo "[INFO] Workspace: ${WORKSPACE}"
          echo "[INFO] Project repo: ${KG_REPO_DIR}"
          echo "[INFO] V2V-GoT repo: ${V2VGOT_ROOT}"
          echo "[INFO] Local LLM endpoint: ${KG_LOCAL_LLM_BASE_URL}"
          echo "[INFO] Local LLM model: ${KG_LOCAL_LLM_MODEL}"

          check_path() {
            local label="$1"
            local path="$2"
            if [ -e "${path}" ]; then
              echo "[PASS] ${label}: ${path}"
            else
              echo "[FAIL] ${label}: ${path}"
              exit 1
            fi
          }

          echo "[INFO] Validating mounted workspace..."
          check_path "Workspace directory" "${WORKSPACE}"
          check_path "kg_coop_drive repo" "${KG_REPO_DIR}"
          check_path "V2V-GoT repo" "${V2VGOT_ROOT}"
          check_path "Phase 5 evaluator" "${KG_REPO_DIR}/scripts/evaluate_v2vgotqa_phase5a.py"
          check_path "Local LLM client" "${KG_REPO_DIR}/src/kg_coop_drive/infrastructure/local_llm_client.py"

          echo "[INFO] Starting local AWQ vLLM server..."
          python3 -m vllm.entrypoints.openai.api_server \
            --model "${KG_LOCAL_LLM_MODEL}" \
            --host 0.0.0.0 \
            --port 8000 \
            --dtype half \
            --quantization awq \
            --max-model-len 2048 \
            --gpu-memory-utilization 0.70 \
            --max-num-seqs 2 \
            --enforce-eager \
            --api-key "${KG_LOCAL_LLM_API_KEY}" \
            > /tmp/awq_vllm.log 2>&1 &

          VLLM_PID=$!
          echo "[INFO] AWQ vLLM pid: ${VLLM_PID}"

          echo "[INFO] Waiting for local AWQ LLM server to become ready..."
          llm_ready() {
            python3 -c 'from urllib.request import Request, urlopen; req=Request("http://127.0.0.1:8000/v1/models", headers={"Authorization": "Bearer local-token"}); print(urlopen(req, timeout=5).read().decode("utf-8"))' >/tmp/awq_models.json 2>/dev/null
          }

          for _ in $(seq 1 120); do
            if llm_ready; then
              echo "[PASS] Local AWQ LLM server is ready."
              break
            fi
            sleep 5
          done

          if ! llm_ready; then
            echo "[FAIL] Local AWQ LLM server did not become ready."
            cat /tmp/awq_vllm.log || true
            exit 1
          fi

          cd "${KG_REPO_DIR}"

          echo
          echo "============================================================"
          echo "Single-Container Runtime + AWQ LLM Pod Ready"
          echo "============================================================"
          echo "[INFO] vLLM log: /tmp/awq_vllm.log"
          echo "[INFO] Model list response: /tmp/awq_models.json"
          echo "[INFO] Endpoint from inside pod: ${KG_LOCAL_LLM_BASE_URL}"
          echo "[INFO] Example:"
          echo "[INFO] python3 scripts/evaluate_v2vgotqa_phase5a.py --split val --limit 10 --baseline-mode cooperative --task-type planning_awareness --planning-ranker llm --planning-selection-policy top2 --llm-base-url ${KG_LOCAL_LLM_BASE_URL} --llm-model ${KG_LOCAL_LLM_MODEL} --llm-api-key ${KG_LOCAL_LLM_API_KEY}"

          tail -f /tmp/awq_vllm.log
      env:
        - name: HUGGING_FACE_HUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: huggingface-token
              key: token
              optional: true
      ports:
        - containerPort: 8000
          name: llm-http
      startupProbe:
        tcpSocket:
          port: 8000
        periodSeconds: 10
        failureThreshold: 120
      readinessProbe:
        tcpSocket:
          port: 8000
        initialDelaySeconds: 5
        periodSeconds: 10
      livenessProbe:
        tcpSocket:
          port: 8000
        initialDelaySeconds: 5
        periodSeconds: 20
      resources:
        requests:
          cpu: "6"
          memory: "24Gi"
          nvidia.com/gpu: "1"
        limits:
          cpu: "6"
          memory: "24Gi"
          nvidia.com/gpu: "1"
      volumeMounts:
        - name: storage
          mountPath: /workspace
        - name: dshm
          mountPath: /dev/shm

  volumes:
    - name: storage
      persistentVolumeClaim:
        claimName: bgupta-pvc
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 2Gi
