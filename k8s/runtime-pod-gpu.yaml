apiVersion: v1
kind: Pod
metadata:
  name: kg-coop-runtime
  namespace: seelab
  labels:
    app: kg-coop-runtime
spec:
  restartPolicy: OnFailure
  tolerations:
    - key: nautilus.io/reservation
      operator: Exists
      effect: NoSchedule
    - effect: PreferNoSchedule
      key: nvidia.com/gpu
      operator: Exists
    - key: nautilus.io/issue
      operator: Exists
      effect: NoSchedule
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                  - NVIDIA-A10
                  - NVIDIA-RTX-A6000
                  - NVIDIA-A100-SXM4-80GB

  containers:
    - name: runtime
      image: pytorch/pytorch:2.2.2-cuda12.1-cudnn8-devel
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash", "-lc"]
      args:
        - |
          set -euo pipefail

          export DEBIAN_FRONTEND=noninteractive
          export WORKSPACE=/workspace
          export REPOS_DIR="${WORKSPACE}/repos"
          export KG_REPO_DIR="${REPOS_DIR}/kg_coop_drive"
          export V2VGOT_ROOT="${REPOS_DIR}/V2V-GoT"

          echo "[INFO] Installing runtime dependencies..."
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            git \
            libgl1 \
            libglib2.0-0 \
            less \
            vim \
            tmux
          rm -rf /var/lib/apt/lists/*

          echo "[INFO] Python version: $(python3 --version)"
          python3 - <<'PY'
          import sys
          if sys.version_info < (3, 8):
              raise SystemExit("[FAIL] Python 3.8+ is required for kg_coop_drive tooling.")
          print("[PASS] Python is new enough for kg_coop_drive tooling.")
          PY
          echo "[INFO] Checking GPU visibility..."
          if command -v nvidia-smi >/dev/null 2>&1; then
            nvidia-smi
          else
            echo "[WARN] nvidia-smi not found in image; checking PyTorch CUDA only."
          fi
          python3 - <<'PY'
          import torch
          print("[INFO] torch:", torch.__version__)
          print("[INFO] torch.cuda.is_available:", torch.cuda.is_available())
          if torch.cuda.is_available():
              print("[INFO] cuda device:", torch.cuda.get_device_name(0))
          PY

          echo "[INFO] Ensuring scikit-learn is available..."
          if python3 -c "import sklearn" >/dev/null 2>&1; then
            echo "[PASS] scikit-learn already installed"
          else
            echo "[INFO] scikit-learn missing; installing via pip..."
            python3 -m pip install --no-cache-dir scikit-learn
            python3 -c "import sklearn; print('[PASS] scikit-learn version:', sklearn.__version__)"
          fi
          echo "[INFO] Workspace: ${WORKSPACE}"
          echo "[INFO] Project repo: ${KG_REPO_DIR}"
          echo "[INFO] V2V-GoT repo: ${V2VGOT_ROOT}"

          check_path() {
            local label="$1"
            local path="$2"
            if [ -e "${path}" ]; then
              echo "[PASS] ${label}: ${path}"
            else
              echo "[FAIL] ${label}: ${path}"
              exit 1
            fi
          }

          echo "[INFO] Validating mounted workspace..."
          check_path "Workspace directory" "${WORKSPACE}"
          check_path "kg_coop_drive repo" "${KG_REPO_DIR}"
          check_path "V2V-GoT repo" "${V2VGOT_ROOT}"
          check_path "QA split pipeline script" "${KG_REPO_DIR}/scripts/run_qa_split_pipeline.py"
          check_path "QA router evaluator script" "${KG_REPO_DIR}/scripts/evaluate_qa_router.py"
          check_path "Val co_llm QA dataset" "${V2VGOT_ROOT}/DMSTrack/V2V4Real/official_models/no_fusion_keep_all/npy/co_llm/v2v4real_3d_grounding_qa_dataset_v2vgot.json"

          cd "${KG_REPO_DIR}"
          python3 -m pip install --no-cache-dir pyyaml pytest scikit-learn plotly addict dash

          echo
          echo "============================================================"
          echo "Runtime Pod Ready"
          echo "============================================================"
          echo "[INFO] Pod will remain running for interactive use."

          tail -f /dev/null
      resources:
        requests:
          cpu: "8"
          memory: "32Gi"
          nvidia.com/gpu: 1
        limits:
          cpu: "8"
          memory: "32Gi"
          nvidia.com/gpu: 1
      volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: dshm
          mountPath: /dev/shm

  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: 
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 8Gi
