apiVersion: v1
kind: Pod
metadata:
  name: kg-coop-runtime
  namespace: seelab
  labels:
    app: kg-coop-runtime
spec:
  restartPolicy: OnFailure

  containers:
    - name: runtime
      image: ubuntu:22.04
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash", "-lc"]
      args:
        - |
          set -euo pipefail

          export DEBIAN_FRONTEND=noninteractive
          export WORKSPACE=/workspace
          export REPOS_DIR="${WORKSPACE}/repos"
          export KG_REPO_DIR="${REPOS_DIR}/kg_coop_drive"
          export V2VGOT_ROOT="${REPOS_DIR}/V2V-GoT"

          echo "[INFO] Installing runtime dependencies..."
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            python3 \
            python3-numpy \
            python3-pip \
            python3-pytest \
            python3-venv \
            git \
            less \
            vim \
            tmux
          rm -rf /var/lib/apt/lists/*

          echo "[INFO] Python version: $(python3 --version)"
          echo "[INFO] Ensuring scikit-learn is available..."
          if python3 -c "import sklearn" >/dev/null 2>&1; then
            echo "[PASS] scikit-learn already installed"
          else
            echo "[INFO] scikit-learn missing; installing via pip..."
            python3 -m pip install --no-cache-dir scikit-learn
            python3 -c "import sklearn; print('[PASS] scikit-learn version:', sklearn.__version__)"
          fi
          echo "[INFO] Workspace: ${WORKSPACE}"
          echo "[INFO] Project repo: ${KG_REPO_DIR}"
          echo "[INFO] V2V-GoT repo: ${V2VGOT_ROOT}"

          check_path() {
            local label="$1"
            local path="$2"
            if [ -e "${path}" ]; then
              echo "[PASS] ${label}: ${path}"
            else
              echo "[FAIL] ${label}: ${path}"
              exit 1
            fi
          }

          echo "[INFO] Validating mounted workspace..."
          check_path "Workspace directory" "${WORKSPACE}"
          check_path "kg_coop_drive repo" "${KG_REPO_DIR}"
          check_path "V2V-GoT repo" "${V2VGOT_ROOT}"
          check_path "QA split pipeline script" "${KG_REPO_DIR}/scripts/run_qa_split_pipeline.py"
          check_path "QA router evaluator script" "${KG_REPO_DIR}/scripts/evaluate_qa_router.py"
          check_path "Val co_llm QA dataset" "${V2VGOT_ROOT}/DMSTrack/V2V4Real/official_models/no_fusion_keep_all/npy/co_llm/v2v4real_3d_grounding_qa_dataset_v2vgot.json"

          cd "${KG_REPO_DIR}"
          python3 -m pip install pyyaml

          echo
          echo "============================================================"
          echo "Running Key Tests"
          echo "============================================================"
          # python3 -m pytest -q \
          #   tests/test_phase2_query_engine.py \
          #   tests/test_v2vgot_scene_adapter.py \
          #   tests/test_scene_builder.py | tee /tmp/phase2_tests.log

          echo
          echo "============================================================"
          echo "Runtime Pod Ready"
          echo "============================================================"
          echo "[INFO] Logs saved to:"
          echo "[INFO]   /tmp/phase2_tests.log"
          echo "[INFO] Pod will remain running for interactive use."

          tail -f /dev/null
      resources:
        requests:
          cpu: "12"
          memory: "32Gi"
        limits:
          cpu: "12"
          memory: "32Gi"
      volumeMounts:
        - name: storage
          mountPath: /workspace

  volumes:
    - name: storage
      persistentVolumeClaim:
        claimName: bgupta-pvc
