apiVersion: v1
kind: Pod
metadata:
  name: kg-coop-runtime-llm
  namespace: seelab
  labels:
    app: kg-coop-runtime-llm
spec:
  restartPolicy: OnFailure
  tolerations:
    - key: nautilus.io/reservation
      operator: Exists
      effect: NoSchedule
    - effect: PreferNoSchedule
      key: nvidia.com/gpu
      operator: Exists
    - key: nautilus.io/issue
      operator: Exists
      effect: NoSchedule
  # Optional A100 pinning for later use when high-memory GPUs are available:
  #
  # tolerations:
  #   - effect: NoSchedule
  #     key: nautilus.io/hardware
  #     operator: Equal
  #     value: large-gpu
  #
  # affinity:
  #   nodeAffinity:
  #     requiredDuringSchedulingIgnoredDuringExecution:
  #       nodeSelectorTerms:
  #         - matchExpressions:
  #             - key: nvidia.com/gpu.product
  #               operator: In
  #               values:
  #                 - NVIDIA-A100-SXM4-80GB

  containers:
    - name: runtime-llm
      image: ghcr.io/abetlen/llama-cpp-python:latest
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash", "-lc"]
      args:
        - |
          set -euo pipefail

          export WORKSPACE=/workspace
          export REPOS_DIR="${WORKSPACE}/repos"
          export KG_REPO_DIR="${REPOS_DIR}/kg_coop_drive"
          export V2VGOT_ROOT="${REPOS_DIR}/V2V-GoT"
          export KG_LOCAL_LLM_BASE_URL="http://127.0.0.1:8000"
          export KG_LOCAL_LLM_MODEL="qwen2.5-3b-instruct-q4_k_m"
          export KG_LOCAL_LLM_API_KEY=""
          export KG_LOCAL_LLM_GGUF_PATH="/workspace/models/qwen2.5-3b-instruct-q4_k_m.gguf"
          # Official Qwen GGUF artifact. Override this env var later if you want
          # to test a different quantization or a different provider mirror.
          export KG_LOCAL_LLM_GGUF_URL="${KG_LOCAL_LLM_GGUF_URL:-https://huggingface.co/Qwen/Qwen2.5-3B-Instruct-GGUF/resolve/main/qwen2.5-3b-instruct-q4_k_m.gguf?download=true}"

          echo "[INFO] Python version: $(python3 --version)"
          echo "[INFO] Workspace: ${WORKSPACE}"
          echo "[INFO] Project repo: ${KG_REPO_DIR}"
          echo "[INFO] V2V-GoT repo: ${V2VGOT_ROOT}"
          echo "[INFO] Local LLM endpoint: ${KG_LOCAL_LLM_BASE_URL}"
          echo "[INFO] Local LLM model: ${KG_LOCAL_LLM_MODEL}"
          echo "[INFO] GGUF path: ${KG_LOCAL_LLM_GGUF_PATH}"

          check_path() {
            local label="$1"
            local path="$2"
            if [ -e "${path}" ]; then
              echo "[PASS] ${label}: ${path}"
            else
              echo "[FAIL] ${label}: ${path}"
              exit 1
            fi
          }

          echo "[INFO] Validating mounted workspace..."
          check_path "Workspace directory" "${WORKSPACE}"
          check_path "kg_coop_drive repo" "${KG_REPO_DIR}"
          check_path "V2V-GoT repo" "${V2VGOT_ROOT}"
          check_path "Phase 5 evaluator" "${KG_REPO_DIR}/scripts/evaluate_v2vgotqa_phase5a.py"
          check_path "Local LLM client" "${KG_REPO_DIR}/src/kg_coop_drive/infrastructure/local_llm_client.py"

          mkdir -p "$(dirname "${KG_LOCAL_LLM_GGUF_PATH}")"
          if [ ! -f "${KG_LOCAL_LLM_GGUF_PATH}" ]; then
            if [ -n "${KG_LOCAL_LLM_GGUF_URL}" ]; then
              echo "[INFO] Downloading GGUF model..."
              python3 -c 'from pathlib import Path; from urllib.request import urlopen; url="'"${KG_LOCAL_LLM_GGUF_URL}"'"; target=Path("'"${KG_LOCAL_LLM_GGUF_PATH}"'"); target.parent.mkdir(parents=True, exist_ok=True); response=urlopen(url); out=target.open("wb"); [out.write(chunk) for chunk in iter(lambda: response.read(1024 * 1024), b"")]; out.close(); response.close()'
            else
              echo "[FAIL] Quantized GGUF model not found at ${KG_LOCAL_LLM_GGUF_PATH}"
              echo "[FAIL] Either pre-place the GGUF file on the PVC or set KG_LOCAL_LLM_GGUF_URL."
              exit 1
            fi
          fi

          echo "[INFO] Starting local quantized llama.cpp server..."
          python3 -m llama_cpp.server \
            --host 0.0.0.0 \
            --port 8000 \
            --model "${KG_LOCAL_LLM_GGUF_PATH}" \
            --model_alias "${KG_LOCAL_LLM_MODEL}" \
            --n_ctx 4096 \
            --n_gpu_layers -1 \
            --chat_format chatml \
            > /tmp/llm_server.log 2>&1 &

          LLM_SERVER_PID=$!
          echo "[INFO] llama.cpp server pid: ${LLM_SERVER_PID}"

          echo "[INFO] Waiting for local LLM server to become ready..."
          llm_ready() {
            python3 -c 'from urllib.request import urlopen; print(urlopen("http://127.0.0.1:8000/v1/models", timeout=5).read().decode("utf-8"))' >/tmp/llm_models.json 2>/dev/null
          }

          for _ in $(seq 1 120); do
            if llm_ready; then
              echo "[PASS] Local LLM server is ready."
              break
            fi
            sleep 5
          done

          if ! llm_ready; then
            echo "[FAIL] Local LLM server did not become ready."
            cat /tmp/llm_server.log || true
            exit 1
          fi

          cd "${KG_REPO_DIR}"

          echo
          echo "============================================================"
          echo "Single-Container Runtime + LLM Pod Ready"
          echo "============================================================"
          echo "[INFO] llama.cpp log: /tmp/llm_server.log"
          echo "[INFO] Model list response: /tmp/llm_models.json"
          echo "[INFO] Endpoint from inside pod: ${KG_LOCAL_LLM_BASE_URL}"
          echo "[INFO] Example:"
          echo "[INFO] python3 scripts/evaluate_v2vgotqa_phase5a.py --split val --limit 10 --baseline-mode cooperative --task-type planning_awareness --planning-ranker llm --planning-selection-policy top2 --llm-base-url ${KG_LOCAL_LLM_BASE_URL} --llm-model ${KG_LOCAL_LLM_MODEL}"

          tail -f /tmp/llm_server.log
      ports:
        - containerPort: 8000
          name: llm-http
      startupProbe:
        tcpSocket:
          port: 8000
        periodSeconds: 10
        failureThreshold: 120
      readinessProbe:
        tcpSocket:
          port: 8000
        initialDelaySeconds: 5
        periodSeconds: 10
      livenessProbe:
        tcpSocket:
          port: 8000
        initialDelaySeconds: 5
        periodSeconds: 20
      resources:
        requests:
          cpu: "6"
          memory: "24Gi"
          nvidia.com/gpu: "1"
        limits:
          cpu: "8"
          memory: "30Gi"
          nvidia.com/gpu: "1"
      volumeMounts:
        - name: storage
          mountPath: /workspace
        - name: dshm
          mountPath: /dev/shm

  volumes:
    - name: storage
      persistentVolumeClaim:
        claimName: bgupta-pvc
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 2Gi
