apiVersion: batch/v1
kind: Job
metadata:
  name: v2vgot-baseline-training
  namespace: seelab
  labels:
    app: v2vgot-baseline-training
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: v2vgot-baseline-training
    spec:
      restartPolicy: Never
      tolerations:
        - key: nautilus.io/reservation
          operator: Exists
          effect: NoSchedule
        - effect: PreferNoSchedule
          key: nvidia.com/gpu
          operator: Exists
        - key: nautilus.io/issue
          operator: Exists
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-A10
                      - NVIDIA-RTX-A6000
                      - NVIDIA-A100-SXM4-80GB

      containers:
        - name: trainer
          image: pytorch/pytorch:2.2.2-cuda12.1-cudnn8-devel
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail

              export DEBIAN_FRONTEND=noninteractive
              export WORKSPACE=/workspace
              export REPOS_DIR="${WORKSPACE}/repos"
              export KG_REPO_DIR="${REPOS_DIR}/kg_coop_drive"
              export V2VGOT_ROOT="${REPOS_DIR}/V2V-GoT"
              export LLAVA_ROOT="${V2VGOT_ROOT}/LLaVA"
              export CONDA_ENV_NAME="${CONDA_ENV_NAME:-llava}"
              export TRAIN_VARIANTS="${TRAIN_VARIANTS:-ego_only early attfuse v2xvit cobevt}"
              # A10-safe default. For A100 runs, override to batch=32 and grad_accum=1.
              export PER_DEVICE_TRAIN_BATCH_SIZE="${PER_DEVICE_TRAIN_BATCH_SIZE:-1}"
              export GRADIENT_ACCUMULATION_STEPS="${GRADIENT_ACCUMULATION_STEPS:-32}"
              export WANDB_MODE="${WANDB_MODE:-disabled}"
              export HF_HOME="${HF_HOME:-${WORKSPACE}/.cache/huggingface}"
              export TRANSFORMERS_CACHE="${TRANSFORMERS_CACHE:-${HF_HOME}/transformers}"
              export PYTORCH_CUDA_ALLOC_CONF="${PYTORCH_CUDA_ALLOC_CONF:-max_split_size_mb:128}"

              unset HF_HUB_ENABLE_HF_TRANSFER || true

              echo "[INFO] Installing system dependencies..."
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential \
                ca-certificates \
                cmake \
                git \
                libgl1 \
                libglib2.0-0 \
                less \
                tmux \
                vim
              rm -rf /var/lib/apt/lists/*

              echo "[INFO] GPU check..."
              nvidia-smi || true
              python3 - <<'PY'
              import torch
              print("torch", torch.__version__)
              print("cuda available", torch.cuda.is_available())
              if torch.cuda.is_available():
                  print("gpu", torch.cuda.get_device_name(0))
              PY

              check_path() {
                local label="$1"
                local path="$2"
                if [ -e "${path}" ]; then
                  echo "[PASS] ${label}: ${path}"
                else
                  echo "[FAIL] ${label}: ${path}"
                  exit 1
                fi
              }

              check_path "kg_coop_drive repo" "${KG_REPO_DIR}"
              check_path "V2V-GoT repo" "${V2VGOT_ROOT}"
              check_path "LLaVA repo" "${LLAVA_ROOT}"
              check_path "train QA JSON" "${V2VGOT_ROOT}/DMSTrack/V2V4Real/official_models/train_no_fusion_keep_all/npy/co_llm/v2v4real_3d_grounding_qa_dataset_v2vllmq5.json"

              echo "[INFO] Preparing conda environment: ${CONDA_ENV_NAME}"
              source /opt/conda/etc/profile.d/conda.sh
              if ! conda env list | awk '{print $1}' | grep -qx "${CONDA_ENV_NAME}"; then
                conda create -n "${CONDA_ENV_NAME}" python=3.10 -y
              fi
              conda activate "${CONDA_ENV_NAME}"

              cd "${LLAVA_ROOT}"
              python -m pip install --upgrade pip
              python -m pip install -e ".[train]"
              python -m pip install --force-reinstall --no-deps \
                accelerate==0.21.0 \
                peft==0.4.0
              python -m pip install hf_transfer

              python - <<'PY'
              import accelerate, peft, transformers
              print("accelerate", accelerate.__version__)
              print("peft", peft.__version__)
              print("transformers", transformers.__version__)
              from transformers import Trainer
              print("Trainer import OK")
              PY

              script_for_variant() {
                case "$1" in
                  ego_only)
                    echo "LLaVA/scripts/v1_5/train_task_lora_7b_my_v2v4real_3d_grounding_v2vllmq5_10ep_both_shallow_f2_ego_only.sh"
                    ;;
                  early)
                    echo "LLaVA/scripts/v1_5/train_task_lora_7b_my_v2v4real_3d_grounding_v2vllmq5_10ep_both_shallow_f2_early.sh"
                    ;;
                  attfuse)
                    echo "LLaVA/scripts/v1_5/train_task_lora_7b_my_v2v4real_3d_grounding_v2vllmq5_10ep_both_shallow_f2_attfuse.sh"
                    ;;
                  v2xvit)
                    echo "LLaVA/scripts/v1_5/train_task_lora_7b_my_v2v4real_3d_grounding_v2vllmq5_10ep_both_shallow_f2_v2xvit.sh"
                    ;;
                  cobevt)
                    echo "LLaVA/scripts/v1_5/train_task_lora_7b_my_v2v4real_3d_grounding_v2vllmq5_10ep_both_shallow_f2_cobevt.sh"
                    ;;
                  *)
                    echo "[FAIL] Unknown variant: $1" >&2
                    return 1
                    ;;
                esac
              }

              checkpoint_for_variant() {
                case "$1" in
                  ego_only)
                    echo "${LLAVA_ROOT}/checkpoints/llava-v1.5-7b-task-lora/llava-v1.5-7b-task-lora_v2v4real_3d_grounding_v2vllmq5_10ep_both_shallow_f2_ego_only/checkpoint-490"
                    ;;
                  early)
                    echo "${LLAVA_ROOT}/checkpoints/llava-v1.5-7b-task-lora/llava-v1.5-7b-task-lora_v2v4real_3d_grounding_v2vllmq5_10ep_both_shallow_f2_early/checkpoint-490"
                    ;;
                  attfuse)
                    echo "${LLAVA_ROOT}/checkpoints/llava-v1.5-7b-task-lora/llava-v1.5-7b-task-lora_v2v4real_3d_grounding_v2vllmq5_10ep_both_shallow_f2_attfuse/checkpoint-490"
                    ;;
                  v2xvit)
                    echo "${LLAVA_ROOT}/checkpoints/llava-v1.5-7b-task-lora/llava-v1.5-7b-task-lora_v2v4real_3d_grounding_v2vllmq5_10ep_both_shallow_f2_v2xvit/checkpoint-490"
                    ;;
                  cobevt)
                    echo "${LLAVA_ROOT}/checkpoints/llava-v1.5-7b-task-lora/llava-v1.5-7b-task-lora_v2v4real_3d_grounding_v2vllmq5_10ep_both_shallow_f2_cobevt/checkpoint-490"
                    ;;
                esac
              }

              output_dir_for_variant() {
                dirname "$(checkpoint_for_variant "$1")"
              }

              train_variant() {
                local variant="$1"
                local script
                local checkpoint
                local output_dir
                script="$(script_for_variant "${variant}")"
                checkpoint="$(checkpoint_for_variant "${variant}")"
                output_dir="$(output_dir_for_variant "${variant}")"

                if [ -d "${checkpoint}" ]; then
                  echo "[SKIP] ${variant}: checkpoint already exists at ${checkpoint}"
                  return 0
                fi

                if [ -d "${output_dir}" ]; then
                  local partial_dir="${output_dir}.partial.$(date +%Y%m%d%H%M%S)"
                  echo "[WARN] ${variant}: found incomplete output dir without checkpoint-490."
                  echo "[WARN] Moving ${output_dir} to ${partial_dir}"
                  mv "${output_dir}" "${partial_dir}"
                fi

                check_path "${variant} training script" "${V2VGOT_ROOT}/${script}"

                echo
                echo "============================================================"
                echo "Training V2V-LLM baseline variant: ${variant}"
                echo "batch=${PER_DEVICE_TRAIN_BATCH_SIZE} grad_accum=${GRADIENT_ACCUMULATION_STEPS}"
                echo "============================================================"

                cd "${V2VGOT_ROOT}"
                source /opt/conda/etc/profile.d/conda.sh
                conda activate "${CONDA_ENV_NAME}"
                unset HF_HUB_ENABLE_HF_TRANSFER || true
                export WANDB_MODE="${WANDB_MODE}"
                export PYTHONPATH="${PYTHONPATH:-}"

                source <(
                  sed \
                    -e "s#llava/train/train_mem.py#llava/train/train.py#g" \
                    -e "s/--per_device_train_batch_size 32/--per_device_train_batch_size ${PER_DEVICE_TRAIN_BATCH_SIZE}/" \
                    -e "s/--gradient_accumulation_steps 1/--gradient_accumulation_steps ${GRADIENT_ACCUMULATION_STEPS}/" \
                    -e "s/--report_to wandb/--report_to none/" \
                    "${script}"
                )

                check_path "${variant} checkpoint" "${checkpoint}"
              }

              for variant in ${TRAIN_VARIANTS}; do
                train_variant "${variant}"
              done

              echo
              echo "============================================================"
              echo "Final checkpoint inventory"
              echo "============================================================"
              find "${LLAVA_ROOT}/checkpoints/llava-v1.5-7b-task-lora" \
                -type d \
                -name "checkpoint-490" \
                | sort

              echo "[INFO] Training job completed."
          env:
            - name: TRAIN_VARIANTS
              value: "ego_only early attfuse v2xvit cobevt"
            - name: PER_DEVICE_TRAIN_BATCH_SIZE
              value: "1"
            - name: GRADIENT_ACCUMULATION_STEPS
              value: "32"
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: "max_split_size_mb:128"
            - name: WANDB_MODE
              value: "disabled"
          resources:
            requests:
              cpu: "8"
              memory: "32Gi"
              nvidia.com/gpu: 1
            limits:
              cpu: "8"
              memory: "32Gi"
              nvidia.com/gpu: 1
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: dshm
              mountPath: /dev/shm

      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: bgupta-pvc
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
