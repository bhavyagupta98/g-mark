[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kg-coop-drive"
version = "0.1.0"
description = "Structured cooperative driving with provenance-aware knowledge graphs."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Bhavya" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
